<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7d65b2"><meta name="referrer" content="no-referrer"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./access.css"><title>紫陽花の旅｜2027 TOKYO × YOKOHAMA</title></head><body>
<section id="gate"><img class="gate-art" src="./hero.webp" alt="三位旅伴與横濱港的紫陽花"><form id="signin"><h1>紫陽花の旅</h1><p>2027 TOKYO × YOKOHAMA</p><label class="trust"><input name="remember" type="checkbox" checked> 保持登入（共用裝置請取消勾選）</label><button class="btn" type="submit" disabled>使用 Google 帳號登入</button><button id="switchAccount" class="btn secondary" type="button" hidden>改用其他 Google 帳號</button><details id="offlineGate" hidden><summary>進階選項 · 離線副本</summary><label>裝置解鎖密語<input name="password" type="password" autocomplete="off"></label><button class="btn secondary" type="submit" name="offline" value="yes">解鎖離線副本</button></details><p id="gateStatus" role="status">正在恢復登入狀態…</p></form></section>
